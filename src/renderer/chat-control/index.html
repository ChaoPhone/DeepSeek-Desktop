<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title></title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="drag-zone">
    <div id="loading-bar"></div>
    <span id="title">Loading...</span>
  </div>
  <button id="pin-btn" title="Pin">
    <svg id="pin-icon-unpinned" viewBox="0 0 16 16" width="12" height="12" fill="currentColor">
      <circle cx="5" cy="11" r="2.5"/>
      <line x1="5" y1="11" x2="12" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <svg id="pin-icon-pinned" viewBox="0 0 16 16" width="12" height="12" fill="currentColor" style="display:none">
      <circle cx="8" cy="4" r="2.5"/>
      <line x1="8" y1="4" x2="8" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>
  <div id="nav-group">
    <button id="menu-btn" title="菜单">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
      </svg>
    </button>
    <div id="nav-balls">
      <button class="nav-ball" id="nav-back" title="后退">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </button>
      <button class="nav-ball" id="nav-forward" title="前进">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
          <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
        </svg>
      </button>
      <button class="nav-ball" id="nav-refresh" title="刷新">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
          <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>
      <button class="nav-ball nav-ball-settings" id="nav-web-settings" title="网页设置">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.611 3.611 0 0112 15.6z"/>
        </svg>
      </button>
    </div>
  </div>
  <div id="error-overlay" style="display:none">
    <span id="error-text">页面加载失败</span>
    <button id="retry-btn">重试</button>
  </div>
  <button id="minimize-btn" title="最小化">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
      <path d="M6 11h12v2H6z"/>
    </svg>
  </button>
  <button id="maximize-btn" title="最大化">
    <svg id="maximize-icon" viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.2">
      <rect x="1.5" y="1.5" width="9" height="9" rx="0.5"/>
    </svg>
    <svg id="restore-icon" viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.2" style="display:none">
      <rect x="1.5" y="4.5" width="6" height="6" rx="0.5"/>
      <rect x="4.5" y="1.5" width="6" height="6" rx="0.5"/>
    </svg>
  </button>
  <button id="close-btn" title="关闭">✕</button>
  <script src="renderer.js"></script>
</body>
</html>
