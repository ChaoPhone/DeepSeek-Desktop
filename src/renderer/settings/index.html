<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自定义外观</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2>自定义外观</h2>

    <div class="field">
      <label>悬浮球大小 <span id="size-val">60</span>px</label>
      <input type="range" id="ball-size" min="16" max="60" step="2" value="22">
    </div>

    <div class="field">
      <label>透明度 <span id="opacity-val">0.9</span></label>
      <input type="range" id="ball-opacity" min="0.3" max="1.0" step="0.05" value="0.9">
    </div>

    <div class="field">
      <label>主题色</label>
      <div class="color-presets" id="color-presets">
        <button class="color-dot" data-color="#4A90D9" style="background:#4A90D9" title="经典蓝"></button>
        <button class="color-dot" data-color="#6C5CE7" style="background:#6C5CE7" title="优雅紫"></button>
        <button class="color-dot" data-color="#00B894" style="background:#00B894" title="清新绿"></button>
        <button class="color-dot" data-color="#FDCB6E" style="background:#FDCB6E" title="暖橙"></button>
        <button class="color-dot" data-color="#E17055" style="background:#E17055" title="珊瑚红"></button>
        <button class="color-dot" data-color="#636E72" style="background:#636E72" title="石墨灰"></button>
      </div>
      <div class="custom-color">
        <input type="color" id="custom-color" value="#4A90D9">
        <span>自定义颜色</span>
      </div>
    </div>

    <div class="actions">
      <button id="reset-btn">恢复默认</button>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
