<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2>外观设置</h2>

    <div class="field">
      <label>悬浮球大小 <span id="size-val">40</span>px</label>
      <input type="range" id="ball-size" min="20" max="80" step="2" value="40">
    </div>

    <div class="field">
      <label>透明度 <span id="opacity-val">0.9</span></label>
      <input type="range" id="ball-opacity" min="0.3" max="1.0" step="0.05" value="0.9">
    </div>

    <div class="field">
      <label>
        <input type="checkbox" id="always-on-top">
        主球置顶
      </label>
    </div>

    <div class="hint">外观设置实时生效，无需保存</div>

    <h2>代理设置</h2>

    <div class="field">
      <label>
        <input type="checkbox" id="proxy-enabled">
        启用代理（仅 ChatGPT/Gemini 生效）
      </label>
    </div>

    <div class="field">
      <label>代理地址</label>
      <input type="text" id="proxy-url" placeholder="如: 127.0.0.1:7897 或 socks5://127.0.0.1:1080">
    </div>

    <div class="actions">
      <button id="reset-btn">恢复默认</button>
      <button id="save-proxy-btn">应用代理</button>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
